<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kent Pusulası İzmir</title>
  <meta name="description" content="İzmir Büyükşehir Belediyesi açık verileriyle konumunuza en yakın nöbetçi eczane, toplanma alanı, otopark, pazar yeri ve daha fazlası.">
  <meta name="color-scheme" content="light dark">
  <script>
    // Tema, sayfa çizilmeden uygulanır (açık/koyu arasında yanıp sönme olmasın).
    try {
      var t = JSON.parse(localStorage.getItem('kp:tema')) || 'auto';
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {
      document.documentElement.dataset.theme = 'light';
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo" id="brandLogo"></span>
        <span class="brand-text">
          <strong>Kent Pusulası</strong>
          <small>İzmir</small>
        </span>
      </div>
      <nav class="nav" id="nav" aria-label="Menü"></nav>
      <div class="sidebar-foot">
        Veriler: <a href="https://acikveri.bizizmir.com/" target="_blank" rel="noopener">İzmir BB Açık Veri Portalı</a> (CC BY 4.0)
      </div>
    </aside>

    <main class="stage">
      <div class="map-area">
        <div id="map"></div>
        <div class="map-tools glass" id="mapTools">
          <div class="map-menu-host" id="mapMenu"></div>
          <button class="tool" id="btnLocate" type="button" title="Konumumu bul" aria-label="Konumumu bul"></button>
          <button class="tool" id="btnPick" type="button" title="Konumu haritadan seç" aria-label="Konumu haritadan seç"></button>
        </div>
        <div class="loc-badge glass" id="locBadge"></div>
      </div>

      <section class="panel glass" aria-live="polite">
        <div class="grabber" aria-hidden="true"></div>
        <header class="panel-head" id="panelHead"></header>
        <div class="panel-body" id="panelBody"></div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.1.3/leaflet-maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
